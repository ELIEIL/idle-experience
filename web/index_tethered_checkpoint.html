<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metaballs</title>
    <style>
        @font-face {
            font-family: 'MDThermochrome';
            src: url('MDThermochrome0.4-Regular-Trial.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background-color: #121212;
        }

        #canvas-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #metaballs-canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="metaballs-canvas"></canvas>
    </div>

    <script>
        const BG_COLOR  = '#0b0701';
        const MAX_BALLS = 15;
        const NUM_MOTHERS = 3;

        const GROUP_CSS  = ['rgba(255,255,255,0.95)','rgba(130,130,255,0.95)','rgba(214,40,40,0.95)'];
        const GROUP_GLSL = [[1.0,1.0,1.0],[0.51,0.51,1.0],[0.839,0.157,0.157]];

        let motherBalls = [], childBalls = [], headlines = [];
        let gl, program, metaballsUniform, ballColorsUniform;
        let overlayCanvas, overlayCtx;
        let initialized = false;

        // ── WebGL ──────────────────────────────────────────────────
        function initWebGL() {
            const canvas = document.getElementById('metaballs-canvas');
            canvas.width = window.innerWidth; canvas.height = window.innerHeight;
            gl = canvas.getContext('webgl');
            if (!gl) { console.error('WebGL not supported'); return; }

            const vs = `attribute vec2 p; void main(){gl_Position=vec4(p,0.,1.);}`;
            const fs = `
                precision highp float;
                uniform vec2 windowSize; uniform vec3 metaballs[15];
                uniform vec3 ballColors[15]; uniform vec3 bg;
                void main(){
                    float rm=min(windowSize.x,windowSize.y)/200.;
                    float xm=windowSize.x/100.; float ym=windowSize.y/100.;
                    float v=0.; vec2 cc=vec2(0.); float cr=1.; float mi=0.; int ci=0;
                    for(int i=0;i<15;i++){
                        vec3 mb=metaballs[i]; float r=mb.z*rm;
                        if(r<0.001) continue;
                        float dx=(mb.x*xm)-gl_FragCoord.x; float dy=(mb.y*ym)-gl_FragCoord.y;
                        float inf=r*r/(dx*dx+dy*dy); v+=inf;
                        if(inf>mi){mi=inf;cc=vec2(mb.x*xm,mb.y*ym);cr=r;ci=i;}
                    }
                    if(abs(v-1.0)<0.025){
                        vec2 d=gl_FragCoord.xy-cc;
                        if(mod((atan(d.y,d.x)+3.14159)*cr,30.)<18.){
                            vec3 c;
                            if(ci==0)c=ballColors[0]; else if(ci==1)c=ballColors[1];
                            else if(ci==2)c=ballColors[2]; else if(ci==3)c=ballColors[3];
                            else if(ci==4)c=ballColors[4]; else if(ci==5)c=ballColors[5];
                            else if(ci==6)c=ballColors[6]; else if(ci==7)c=ballColors[7];
                            else if(ci==8)c=ballColors[8]; else if(ci==9)c=ballColors[9];
                            else if(ci==10)c=ballColors[10]; else if(ci==11)c=ballColors[11];
                            else if(ci==12)c=ballColors[12]; else if(ci==13)c=ballColors[13];
                            else c=ballColors[14];
                            gl_FragColor=vec4(c,1.);
                        } else gl_FragColor=vec4(bg,1.);
                    } else gl_FragColor=vec4(bg,1.);
                }`;

            const vs_ = compileShader(gl, vs, gl.VERTEX_SHADER);
            const fs_ = compileShader(gl, fs, gl.FRAGMENT_SHADER);
            if (!vs_ || !fs_) return;
            program = createProgram(gl, vs_, fs_);
            if (!program) return;
            gl.useProgram(program);

            const buf = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, buf);
            gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
            const pa = gl.getAttribLocation(program, 'p');
            gl.enableVertexAttribArray(pa);
            gl.vertexAttribPointer(pa, 2, gl.FLOAT, false, 0, 0);

            metaballsUniform  = gl.getUniformLocation(program, 'metaballs');
            ballColorsUniform = gl.getUniformLocation(program, 'ballColors');
            gl.uniform2fv(gl.getUniformLocation(program,'windowSize'), [canvas.width, canvas.height]);
            gl.uniform3fv(gl.getUniformLocation(program,'bg'), hexToRgb(BG_COLOR));
            gl.viewport(0, 0, canvas.width, canvas.height);
        }

        function compileShader(gl, src, type) {
            const s = gl.createShader(type);
            gl.shaderSource(s, src); gl.compileShader(s);
            if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
                console.error('Shader:', gl.getShaderInfoLog(s)); return null;
            }
            return s;
        }
        function createProgram(gl, v, f) {
            const p = gl.createProgram();
            gl.attachShader(p,v); gl.attachShader(p,f); gl.linkProgram(p);
            if (!gl.getProgramParameter(p, gl.LINK_STATUS)) {
                console.error('Link:', gl.getProgramInfoLog(p)); return null;
            }
            return p;
        }
        function hexToRgb(hex) {
            const r = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return r ? [parseInt(r[1],16)/255, parseInt(r[2],16)/255, parseInt(r[3],16)/255] : [0,0,0];
        }

        function renderWebGL() {
            if (!gl || !program) return;
            const all = getAllBalls();
            const pos = new Float32Array(MAX_BALLS*3), col = new Float32Array(MAX_BALLS*3);
            all.forEach((b,i) => {
                pos[i*3]=b.x; pos[i*3+1]=b.y; pos[i*3+2]=b.radius;
                const c = GROUP_GLSL[b.group]||GROUP_GLSL[0];
                col[i*3]=c[0]; col[i*3+1]=c[1]; col[i*3+2]=c[2];
            });
            gl.uniform3fv(metaballsUniform, pos);
            gl.uniform3fv(ballColorsUniform, col);
            gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }

        // ── Overlay ────────────────────────────────────────────────
        function initOverlay() {
            overlayCanvas = document.createElement('canvas');
            overlayCanvas.style.cssText = 'position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:10;';
            overlayCanvas.width = window.innerWidth; overlayCanvas.height = window.innerHeight;
            document.getElementById('canvas-container').appendChild(overlayCanvas);
            overlayCtx = overlayCanvas.getContext('2d');
        }

        // ── Ball management ────────────────────────────────────────
        function initBalls() {
            motherBalls = [
                { x:22, y:68, vx:1.4, vy:0.9,  radius:24, group:0 },
                { x:52, y:35, vx:-1.1,vy:1.7,  radius:26, group:1 },
                { x:78, y:65, vx:1.2, vy:-1.4, radius:23, group:2 }
            ];
        }

        function spawnChildren(motherIdx, posts) {
            const mo = motherBalls[motherIdx];
            const n  = Math.min(2+Math.floor(Math.random()*3), posts.length);
            for (let j=0;j<n;j++) {
                const a = (j/n)*Math.PI*2 + Math.random()*0.5;
                childBalls.push({
                    x: Math.max(5,Math.min(95, mo.x+Math.cos(a)*22)),
                    y: Math.max(5,Math.min(95, mo.y+Math.sin(a)*18)),
                    vx:(Math.random()-.5)*1.5, vy:(Math.random()-.5)*1.5,
                    radius: 9+Math.random()*5,
                    motherIdx, group:mo.group, post:posts[j]
                });
            }
        }

        function getAllBalls() {
            const all = [...motherBalls,...childBalls];
            while (all.length < MAX_BALLS) all.push({x:0,y:0,radius:0,group:0});
            return all.slice(0, MAX_BALLS);
        }

        function updateBalls() {
            const spd=0.01;
            motherBalls.forEach(b => {
                b.x+=b.vx*spd; b.y+=b.vy*spd;
                const m=b.radius*0.14;
                if(b.x<m||b.x>100-m){b.vx*=-1;b.x=Math.max(m,Math.min(100-m,b.x));}
                if(b.y<m||b.y>100-m){b.vy*=-1;b.y=Math.max(m,Math.min(100-m,b.y));}
            });
            const W=window.innerWidth, H=window.innerHeight, rm=Math.min(W,H)/200;
            childBalls.forEach(cb => {
                const mo=motherBalls[cb.motherIdx];
                const dx=mo.x-cb.x, dy=mo.y-cb.y, dist=Math.sqrt(dx*dx+dy*dy);
                const restPx=(mo.radius+cb.radius)*rm+15;
                const restDist=Math.sqrt(Math.pow(restPx*100/W,2)+Math.pow(restPx*100/H,2))*0.9;
                if(dist>restDist&&dist>0.001){
                    const f=(dist-restDist)*0.045;
                    cb.vx+=(dx/dist)*f; cb.vy+=(dy/dist)*f;
                }
                cb.vx*=0.93; cb.vy*=0.93;
                cb.x+=cb.vx*spd; cb.y+=cb.vy*spd;
                if(cb.x<2||cb.x>98){cb.vx*=-1;cb.x=Math.max(2,Math.min(98,cb.x));}
                if(cb.y<2||cb.y>98){cb.vy*=-1;cb.y=Math.max(2,Math.min(98,cb.y));}
            });
        }

        // ── Rendering ──────────────────────────────────────────────
        function wrapText(ctx, text, maxWidth) {
            const words=text.split(' '); const lines=[]; let line='';
            for(const w of words){
                const t=line?line+' '+w:w;
                if(ctx.measureText(t).width>maxWidth&&line){lines.push(line);line=w;}
                else line=t;
            }
            if(line)lines.push(line); return lines;
        }

        function drawBallText(b, isMother) {
            const W=overlayCanvas.width, H=overlayCanvas.height;
            const rm=Math.min(W,H)/200;
            const cx=(b.x/100)*W, cy=H-(b.y/100)*H, r=b.radius*rm;
            const clipR=r*0.80;
            const fontSize=Math.max(9,Math.round(r*(isMother?0.14:0.20)));
            const tracking=fontSize*0.20, maxTxtW=clipR*1.65;
            const lineHeight=fontSize*1.55;
            const maxLines=Math.max(1,Math.floor((clipR*1.80)/lineHeight));
            const color=GROUP_CSS[b.group]||GROUP_CSS[0];
            overlayCtx.save();
            overlayCtx.beginPath(); overlayCtx.arc(cx,cy,clipR,0,Math.PI*2); overlayCtx.clip();
            overlayCtx.font=`500 ${fontSize}px "MDThermochrome","Courier New",monospace`;
            overlayCtx.fillStyle=color; overlayCtx.textAlign='center'; overlayCtx.textBaseline='middle';
            if('letterSpacing' in overlayCtx) overlayCtx.letterSpacing=`${tracking}px`;

            if (isMother) {
                const idx=motherBalls.indexOf(b);
                const text=headlines[idx]?headlines[idx].title.toUpperCase():'LOADING...';
                let lines=wrapText(overlayCtx,text,maxTxtW);
                if(lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].replace(/\s+\S*$/,'')+' ...';}
                const totalH=lines.length*lineHeight, startY=cy-totalH/2+lineHeight/2;
                lines.forEach((ln,j)=>overlayCtx.fillText(ln,cx,startY+j*lineHeight));
            } else {
                const post=b.post;
                if (!post) { overlayCtx.fillText('LOADING...',cx,cy); overlayCtx.restore(); return; }
                // Title lines (smaller font, leave room for meta)
                const metaFontSize=Math.max(7,Math.round(fontSize*0.75));
                const titleMaxLines=Math.max(1,maxLines-2);
                let titleLines=wrapText(overlayCtx,post.title.toUpperCase(),maxTxtW);
                if(titleLines.length>titleMaxLines){titleLines=titleLines.slice(0,titleMaxLines);titleLines[titleMaxLines-1]=titleLines[titleMaxLines-1].replace(/\s+\S*$/,'')+' ...';}
                const titleH=titleLines.length*lineHeight;
                // Meta line: score + comments
                const score=post.score>=1000?(post.score/1000).toFixed(1)+'K':String(post.score);
                const meta=`u/${post.author}  ↑${score}  ${post.num_comments} comments`;
                const metaH=metaFontSize*1.8;
                const totalH=titleH+metaH+fontSize*0.4;
                const startY=cy-totalH/2+lineHeight/2;
                titleLines.forEach((ln,j)=>overlayCtx.fillText(ln,cx,startY+j*lineHeight));
                // Draw meta in smaller, dimmer font
                overlayCtx.font=`500 ${metaFontSize}px "MDThermochrome","Courier New",monospace`;
                overlayCtx.fillStyle=color.replace('0.95','0.50');
                if('letterSpacing' in overlayCtx) overlayCtx.letterSpacing=`${Math.round(metaFontSize*0.15)}px`;
                overlayCtx.fillText(meta,cx,startY+titleH+fontSize*0.4);
            }
            overlayCtx.restore();
        }

        function renderOverlay() {
            if (!overlayCtx) return;
            const W=overlayCanvas.width, H=overlayCanvas.height;
            overlayCtx.clearRect(0,0,W,H);

            childBalls.forEach(cb => {
                const mo=motherBalls[cb.motherIdx];
                const cx=(cb.x/100)*W, cy=H-(cb.y/100)*H;
                const mx=(mo.x/100)*W, my=H-(mo.y/100)*H;
                overlayCtx.save();
                overlayCtx.setLineDash([]);
                overlayCtx.strokeStyle=(GROUP_CSS[cb.group]||GROUP_CSS[0]).replace('0.95','0.65');
                overlayCtx.lineWidth=1.5;
                overlayCtx.beginPath(); overlayCtx.moveTo(cx,cy); overlayCtx.lineTo(mx,my);
                overlayCtx.stroke(); overlayCtx.restore();
            });

            motherBalls.forEach(b=>drawBallText(b,true));
            childBalls.forEach(b=>drawBallText(b,false));
        }

        // ── Data ───────────────────────────────────────────────────
        async function fetchHeadlines() {
            try {
                const res=await fetch('http://localhost:5001/api/headlines?keyword=world+news&limit=3');
                headlines=(await res.json()).headlines||[];
            } catch(e) {
                headlines=[
                    {title:'Global Leaders Meet on Climate Emergency'},
                    {title:'Economic Tensions Rise Between Major Powers'},
                    {title:'Conflict Escalates Across Multiple Regions'}
                ];
            }
        }

        async function fetchAndAssignPosts() {
            try {
                const res=await fetch('http://localhost:5001/api/reddit?subreddit=worldnews&limit=12');
                const posts=((await res.json()).posts||[]).sort(()=>Math.random()-.5);
                let off=0;
                for(let m=0;m<NUM_MOTHERS;m++){
                    const cnt=2+Math.floor(Math.random()*3);
                    spawnChildren(m,posts.slice(off,off+cnt)); off+=cnt;
                }
            } catch(e){ console.warn('Reddit failed:',e); }
        }

        // ── Init & loop ────────────────────────────────────────────
        async function init() {
            initBalls(); initWebGL(); initOverlay(); initialized=true;
            await Promise.all([fetchHeadlines(), fetchAndAssignPosts()]);
            requestAnimationFrame(loop);
        }
        function loop(){ updateBalls(); renderWebGL(); renderOverlay(); requestAnimationFrame(loop); }

        window.addEventListener('load', async () => {
            await document.fonts.load('500 16px "MDThermochrome"');
            init();
        });
        window.addEventListener('resize', () => {
            const canvas=document.getElementById('metaballs-canvas');
            if(canvas&&gl){
                canvas.width=window.innerWidth; canvas.height=window.innerHeight;
                gl.viewport(0,0,canvas.width,canvas.height);
                gl.uniform2fv(gl.getUniformLocation(program,'windowSize'),[canvas.width,canvas.height]);
            }
            if(overlayCanvas){ overlayCanvas.width=window.innerWidth; overlayCanvas.height=window.innerHeight; }
        });
    </script>
</body>
</html>
